<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAV BAR</title>
    <STYle>
        .CONTAINER {
            position: fixed;
            width: 100%;
            height: auto;
            background-color: burlywood;
        }

        .HEADING {
            font-size: 30px;

        }

        .NAVID {

            display: flex;
            position: relative;
            bottom: 15px;
            left: 700px;
            gap: 25px;

        }

        .NAVID a {
            text-decoration: none;
            color: aliceblue;
        }
    </STYle>
</head>

<body>
    <div class="CONTAINER">
        <div class="HEADING">
            MY WEBSITE
        </div>
        <DIV class="NAVID"><a href="">HOME</a>
            <a href="">ABOUT US</a>
            <a href="">GALLERY</a>
            <a href="">CONTACT US</a>
        </DIV>
    </div>
</body>

</html>
